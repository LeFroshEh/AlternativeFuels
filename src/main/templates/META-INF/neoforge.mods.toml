# Alternative Fuels - mod metadata
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile = "logo.png"
authors="LeFroshEh"
description='''
Adds bio fuels to Immersive Engineering, with the help of Immersive Petroleum and Immersive Mechanical.
'''

# ---------------------------------------------------------------------------
# REQUIRED dependencies
# ---------------------------------------------------------------------------

[[dependencies.alternativefuels]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.alternativefuels]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.alternativefuels]]
modId="immersiveengineering"
type="required"
reason="Mixer recipes, the manual and the mixer mixins are built on Immersive Engineering"
versionRange="[12.4.2-194,)"
ordering="AFTER"
side="BOTH"

[[dependencies.alternativefuels]]
modId="immersivepetroleum"
type="required"
reason="Gasoline, the portable generator fuels and the refinery integration come from Immersive Petroleum"
versionRange="[4.5.0-39,)"
ordering="AFTER"
side="BOTH"

[[dependencies.alternativefuels]]
modId="immersive_mechanical"
type="required"
reason="The pyrolysis oven recipe change patches Immersive Mechanical"
versionRange="[2101.0.0,)"
ordering="AFTER"
side="BOTH"

# ---------------------------------------------------------------------------
# OPTIONAL dependencies (the mod works without them)
# ---------------------------------------------------------------------------

[[dependencies.alternativefuels]]
modId="jei"
type="optional"
reason="Shows both fluid inputs of two-fluid mixer recipes in the Mixer tab"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.alternativefuels]]
modId="createaddition"
type="optional"
reason="Liquid burning recipes for the added fuels"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[dependencies.alternativefuels]]
modId="createdieselgenerators"
type="optional"
reason="Distillation recipes for the added fuels"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="alternativefuels.mixins.json"
